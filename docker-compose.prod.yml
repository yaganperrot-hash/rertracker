services:
  db:
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./frontend/data:/app/frontend/data
      - ./transferts:/app/transferts
      - ./publications:/app/publications
    # Un seul worker : le scheduler démarre dans le lifespan de l'application, donc une fois par worker.
    # Deux workers = chaque relevé PRIM en double (quota), récap du bot en double.
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --workers 1
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
