<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RETARDS IDF — Statistiques</title>
<meta name="description" content="Bilan chiffré du réseau RER et Transilien d'Île-de-France : retards, suppressions, perturbations et coûts.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="nav.css?v=2">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }

:root {
  --bg:     #F7F4EF;
  --bg2:    #EDEAE4;
  --bg3:    #E2DED7;
  --border: #D4CFC7;
  --ink:    #000000;
  --text:   #000000;
  --muted:  #555555;
  --sub:    #333333;
  --red:    #C0392B;
  --ok:     #2ECC71;
  --blanc:  #fff;
  --nav-bg: var(--bg);
  /* aliases pour composants existants */
  --creme: var(--bg);
  --encre: var(--ink);
  --brun: var(--sub);
  --gris: var(--muted);
  --gris-clair: #a39c8c;
  --sable: var(--bg2);
  --filet: var(--bg3);
  --creux: var(--border);
  --rouge: var(--red);
  --rouge-fonce: #A32D2D;
  --rouge-pale: #FCEBEB;
}

html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  font-family: 'Roboto', -apple-system, sans-serif;
  color: var(--text);
  font-size: 16px;
  line-height: 1.4;
}
a { color: var(--muted); }

.page { max-width: 960px; margin: 0 auto; padding-block: 32px; padding-inline: 16px; text-align: center; }
@media (min-width: 600px) { .page { padding-inline: 30px; } }

.eyebrow { font-size: 13px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; font-weight: 500; }

/* ── Sélecteur période ── */
.toggle { display: inline-flex; background: var(--sable); border-radius: 8px; padding: 3px; margin-bottom: 6px; font-size: 14px; }
.toggle button, .toggle a {
  border: 0; background: none; font: inherit; cursor: pointer; text-decoration: none;
  padding: 7px 20px; color: var(--gris); border-radius: 6px;
}
.toggle button:hover, .toggle a:hover { color: var(--encre); }
.toggle [aria-pressed="true"] { background: var(--encre); color: #fff; }
.toggle button:focus-visible { outline: 2px solid var(--encre); outline-offset: 1px; }

/* ── Hero ── */
.hero {
  position: relative;
  padding: 26px 32px 18px;
  text-align: center;
}
.hero-date {
  font-weight: 400; font-size: 11px; letter-spacing: 2px;
  text-transform: uppercase; color: var(--sub); margin-bottom: 2px;
}
.hero-time {
  font-weight: 400; font-size: 11px; letter-spacing: 2px;
  text-transform: uppercase; color: var(--muted); margin-bottom: 12px;
}
.hero-subtitle {
  font-weight: 500; font-size: clamp(16px, 2.4vw, 22px);
  line-height: 1.3; color: var(--ink); margin-bottom: 14px;
}
.hero-counter {
  font-weight: 900; font-size: clamp(52px, 10.4vw, 112px);
  letter-spacing: -3px; line-height: .88; color: var(--ink);
}
.hero-unit {
  font-weight: 400; font-size: 11px; letter-spacing: 1px;
  text-transform: uppercase; color: var(--sub); margin-top: 8px;
}

/* ── KPI Bar ── */
.kpi-bar {
  display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;
  margin-bottom: 24px;
}
.kpi-card {
  background: var(--blanc); border-radius: 10px; padding: 14px 18px;
  text-align: center; min-width: 110px; flex: 1; max-width: 170px;
  cursor: pointer; transition: box-shadow 0.15s, border-color 0.15s;
  border: 2px solid transparent;
}
.kpi-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.kpi-card.active { border-color: var(--ink); }
.kpi-value {
  font-size: clamp(22px, 4vw, 32px); font-weight: 900;
  font-variant-numeric: tabular-nums; line-height: 1.1; color: var(--ink);
}
.kpi-label {
  font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px;
  color: var(--muted); margin-top: 4px;
}

/* ── Classement ── */
.classement { text-align: left; margin-bottom: 32px; }
.classement-title {
  font-size: 16px; font-weight: 700; letter-spacing: 1px;
  text-transform: uppercase; color: var(--ink); margin-bottom: 14px;
  text-align: center;
}
.ligne-card {
  display: grid;
  grid-template-columns: 28px 62px 170px 1fr 90px 20px;
  align-items: center; gap: 10px;
  background: var(--blanc); border-radius: 10px; padding: 12px 16px;
  margin-bottom: 8px; cursor: pointer; transition: box-shadow 0.15s;
}
.ligne-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.ligne-card[aria-expanded="true"] { outline: 2px solid var(--ink); }
.ligne-rank { font-size: 14px; font-weight: 700; color: var(--muted); text-align: center; }
.ligne-badge {
  display: inline-block; color: #fff; font-weight: 700; font-size: 14px;
  padding: 4px 10px; border-radius: 6px; justify-self: start;
}
.ligne-counters { display: flex; gap: 10px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.ligne-bar-wrap { height: 8px; background: var(--bg2); border-radius: 4px; overflow: hidden; }
.ligne-bar { height: 100%; border-radius: 4px; transition: width 0.3s; }
.ligne-cost {
  font-size: 15px; font-weight: 700; text-align: right; white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.ligne-chevron {
  font-size: 16px; color: var(--muted); transition: transform 0.2s;
  text-align: center;
}
.ligne-card[aria-expanded="true"] .ligne-chevron { transform: rotate(90deg); }

/* ── Panel deltas ── */
.panel-deltas { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
.delta-badge {
  font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 6px;
}
.delta-badge.hausse { background: var(--rouge-pale); color: var(--rouge-fonce); }
.delta-badge.baisse { background: #E8F8EE; color: #1B7A3D; }
.delta-badge.nd { background: var(--bg2); color: var(--muted); }

/* ── Panneau détails ── */
.detail-panel {
  background: var(--blanc); border-radius: 12px; padding: 24px 28px;
  margin-bottom: 32px; animation: fadeIn 0.2s ease; text-align: left;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.panel-header {
  display: flex; align-items: center; gap: 12px; margin-bottom: 18px;
  flex-wrap: wrap;
}
.panel-header .badge {
  display: inline-block; color: #fff; font-weight: 700; font-size: 18px;
  padding: 6px 14px; border-radius: 6px;
}
.panel-title { font-size: 22px; font-weight: 500; }
.panel-close {
  margin-left: auto; border: none; background: var(--sable); color: var(--gris);
  width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-size: 16px;
  display: flex; align-items: center; justify-content: center;
}
.panel-close:hover { background: var(--creux); }

/* Tuiles pire/meilleur mois */
.month-tiles { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
.month-tile {
  flex: 1; min-width: 140px; padding: 12px 14px; border-radius: 8px;
  background: var(--creme);
}
.month-tile .mt-label { font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: var(--gris); }
.month-tile .mt-month { font-size: 20px; font-weight: 500; margin-top: 4px; }
.month-tile .mt-cost { font-size: 14px; color: var(--gris); margin-top: 2px; }
.month-tile.worst { border-left: 3px solid var(--rouge); }
.month-tile.best { border-left: 3px solid #2ECC71; }

/* Calendrier heatmap */
.heatmap-section { margin-bottom: 20px; }
.heatmap-section .eyebrow { margin-bottom: 10px; }
.heatmap-wrap { overflow-x: auto; padding-bottom: 6px; position: relative; }
.heatmap-wrap::-webkit-scrollbar { height: 4px; }
.heatmap-wrap::-webkit-scrollbar-thumb { background: var(--creux); border-radius: 2px; }
.heatmap-section { position: relative; }
.heatmap-hint {
  display: none; font-size: 11px; color: var(--gris-clair); text-align: center;
  margin-top: 4px; letter-spacing: 0.5px;
}
@media (max-width: 768px) {
  .heatmap-hint { display: block; }
}
.heatmap {
  display: grid;
  grid-template-columns: 40px repeat(31, 20px);
  grid-template-rows: repeat(12, 20px);
  gap: 3px; font-size: 11px;
}
.hm-month {
  display: flex; align-items: center; justify-content: flex-end;
  padding-right: 5px; color: var(--gris); font-size: 11px; font-weight: 500;
}
.hm-cell {
  border-radius: 3px; width: 20px; height: 20px;
}
.hm-empty { background: var(--filet); }
.hm-null { background: transparent; }
/* Niveaux de gravité : clair → foncé */
.hm-0 { background: #EAE3D3; }
.hm-1 { background: #E4BBA2; }
.hm-2 { background: #D68A63; }
.hm-3 { background: #BE4E2E; }
.hm-4 { background: #8A2817; }

/* Causes barres */
.causes-section { margin-bottom: 20px; }
.causes-section .eyebrow { margin-bottom: 10px; }
.cause-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.cause-label { width: 170px; flex-shrink: 0; font-size: 15px; color: var(--brun); text-align: right; }
.cause-bar-wrap { flex: 1; height: 24px; background: var(--sable); border-radius: 4px; overflow: hidden; }
.cause-bar { height: 100%; border-radius: 4px; transition: width 0.3s; }
.cause-pct { width: 50px; flex-shrink: 0; font-size: 14px; font-weight: 500; color: var(--gris); }

/* Directions */
.directions-section .eyebrow { margin-bottom: 10px; }
.dir-row {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 0; border-bottom: 1px solid var(--filet); font-size: 15px;
}
.dir-row:last-child { border: none; }
.dir-dot {
  width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0;
}
.dir-label { flex: 1; color: var(--brun); }
.dir-count { font-weight: 500; color: var(--gris); white-space: nowrap; }

/* ── États ── */
main[aria-busy="true"] { opacity: .45; transition: opacity .15s; }
.message { font-size: 15px; color: var(--gris); padding: 24px 0; }
.pied {
  font-size: 12px; color: var(--gris-clair);
  margin-top: 40px; padding-top: 14px; border-top: 1px solid var(--sable);
}

@media (max-width: 768px) {
  .hero { padding: 22px 16px 16px; }
  .ligne-counters { display: none; }
  .ligne-card { grid-template-columns: 28px 62px 1fr 80px 20px; }
}
@media (max-width: 480px) {
  .kpi-bar { display: grid; grid-template-columns: repeat(3, 1fr); }
  .kpi-card { max-width: none; padding: 10px 8px; min-width: 0; }
  .kpi-label { font-size: 9px; letter-spacing: 1px; }
  .ligne-card { grid-template-columns: 24px 50px 1fr 70px 16px; gap: 6px; padding: 10px 12px; }
  .heatmap {
    grid-template-columns: 34px repeat(31, 16px);
    grid-template-rows: repeat(12, 16px);
  }
  .hm-cell { width: 16px; height: 16px; }
  .cause-label { width: 110px; font-size: 13px; }
  .month-tiles { flex-direction: column; }
}
</style>
</head>

<ul class="nav-menu" id="nav-menu">
  <li><a href="/">Aujourd'hui</a></li>

</ul>

<div class="page">

  <div class="toggle" role="group" aria-label="Période">
    <button type="button" data-p="semaine" aria-pressed="false">Semaine</button>
    <button type="button" data-p="mois" aria-pressed="true">Mois</button>
    <button type="button" data-p="annee" aria-pressed="false">Année</button>
  </div>

  <main id="contenu">
    <section class="hero" aria-label="Chiffres de la période">
      <div class="hero-date" id="h-date">&nbsp;</div>
      <div class="hero-time" id="h-time">&nbsp;</div>
      <div class="hero-subtitle" id="h-subtitle">Ce mois-ci, les retards ont coûté</div>
      <div class="hero-counter" id="h-cout">— €</div>
      <div class="hero-unit">au SMIC horaire brut · réseau IDF complet</div>
    </section>

    <section class="kpi-bar" id="kpi-bar" aria-label="Indicateurs clés"></section>

    <div id="kpi-detail"></div>

    <section class="classement" id="classement" aria-label="Classement des lignes">
      <div class="classement-title">Classement des 13 lignes</div>
      <div id="classement-list"></div>
    </section>

    <div id="detail-panel-container"></div>
  </main>

  <p class="message" id="message" hidden></p>

  <footer class="pied" id="pied">Données API PRIM · IDF Mobilités</footer>

</div>

<script src="duree.js"></script>
<script src="bilan.js?v=2"></script>
<script>
(function () {
  var B = window.Bilan;
  var $ = function(id) { return document.getElementById(id); };
  var NBSP = '\u00a0';

  var GRAVITE_COULEURS = ['#EAE3D3', '#E4BBA2', '#D68A63', '#BE4E2E', '#8A2817'];

  var PERIODES = {
    semaine: { label: 'Semaine en cours', cle: 'semaine', subtitle: 'Cette semaine, les retards des RER et Transiliens ont coûté' },
    mois:    { label: 'Mois en cours', cle: 'mois', subtitle: 'Ce mois-ci, les retards des RER et Transiliens ont coûté' },
    annee:   { label: 'Année en cours', cle: 'annee', subtitle: 'Cette année, les retards des RER et Transiliens ont coûté' },
  };

  var donnees = null;
  var _totaux = null;
  var _tranchesRetard = null;
  var periodeActuelle = 'mois';
  var kpiOuvert = null;     // clé du KPI dont le détail est ouvert
  var ligneSelectionnee = null;
  var majHeure = null;
  var smicHoraire = null;
  var meta = null;

  // ── Formats ────────────────────────────────────────────────

  function fmtNombre(n) { return Number(n || 0).toLocaleString('fr-FR'); }
  function fmtEuros(n) { return fmtNombre(n) + NBSP + '€'; }
  function fmtEurosCompact(n) {
    n = n || 0;
    if (n >= 1e6) return (n / 1e6).toLocaleString('fr-FR', { maximumFractionDigits: 1 }) + NBSP + 'M€';
    if (n >= 1e5) return fmtNombre(Math.round(n / 1e3)) + NBSP + 'k€';
    return fmtEuros(n);
  }

  var MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin',
              'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
  var MOIS_COURT = ['jan.', 'fév.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];

  function fmtDateCourte(d) {
    return d.getDate() + ' ' + MOIS_COURT[d.getMonth()];
  }

  function dateIso(iso) {
    var t = iso.split('-').map(Number);
    return new Date(t[0], t[1] - 1, t[2]);
  }

  function labelPeriode() {
    if (!meta || !meta.periodes) return '';
    var au = dateIso(meta.au);
    // Pour "Année" avec données partielles : afficher directement "Depuis le 16 septembre 2026"
    if (periodeActuelle === 'annee' && meta.debut_donnees && meta.debut_donnees > meta.periodes[periodeActuelle]) {
      var debut = dateIso(meta.debut_donnees);
      return ('Depuis le ' + debut.getDate() + ' ' + MOIS[debut.getMonth()] + ' ' + au.getFullYear()).toUpperCase();
    }
    var txt = fmtDateCourte(dateIso(meta.periodes[periodeActuelle])) + ' — ' + fmtDateCourte(au) + ' ' + au.getFullYear();
    if (meta.debut_donnees && meta.debut_donnees > meta.periodes[periodeActuelle]) {
      txt += ' · données depuis le ' + fmtDateCourte(dateIso(meta.debut_donnees));
    }
    return txt.toUpperCase();
  }

  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, function(c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function fmtCompact(n) {
    n = n || 0;
    if (n >= 1e6) return (n / 1e6).toLocaleString('fr-FR', { maximumFractionDigits: 1 }) + NBSP + 'M';
    if (n >= 1e4) return fmtNombre(Math.round(n / 1e3)) + NBSP + 'k';
    return fmtNombre(n);
  }

  function fmtDelta(pct) {
    if (pct === null || pct === undefined) return null;
    if (Math.abs(pct) < 0.5) return { texte: '=' + NBSP + '0' + NBSP + '%', classe: 'nd' };
    var v = fmtNombre(Math.round(Math.abs(pct))) + NBSP + '%';
    return pct > 0 ? { texte: '▲' + NBSP + v, classe: 'hausse' } : { texte: '▼' + NBSP + v, classe: 'baisse' };
  }

  // ── Hero ──────────────────────────────────────────────────

  function renderHero(lignes) {
    var p = PERIODES[periodeActuelle];
    var t = _totaux ? _totaux[p.cle] : null;
    var totalEur = t ? t.euros : 0;

    $('h-date').textContent = labelPeriode();
    $('h-time').textContent = majHeure ? 'MÀJ ' + majHeure : '';
    $('h-subtitle').textContent = p.subtitle;
    $('h-cout').textContent = fmtNombre(totalEur) + ' €';
  }

  // ── KPI Bar ───────────────────────────────────────────────

  var KPIS = [
    { cle: 'nb_rt_delays', label: 'retards', titre: 'Retards mesurés' },
    { cle: 'nb_cancelled', label: 'supprimés', titre: 'Trains supprimés' },
    { cle: 'nb_disruptions', label: 'perturbations', titre: 'Perturbations déclarées' },
    { cle: null, label: 'lignes touchées' },
    { cle: 'minutes', label: 'minutes perdues', titre: 'Minutes-voyageurs perdues' },
  ];

  function renderKpiBar() {
    var p = periodeActuelle;
    var t = _totaux ? _totaux[p] : null;
    if (!t) { $('kpi-bar').innerHTML = ''; return; }

    var valeurs = [
      fmtCompact(t.nb_rt_delays),
      fmtCompact(t.nb_cancelled),
      fmtCompact(t.nb_disruptions),
      (donnees ? donnees.filter(function(l) { return l.cout[p].euros > 0; }).length : 0) + '/13',
      fmtCompact(t.minutes),
    ];

    var container = $('kpi-bar');
    container.innerHTML = '';

    KPIS.forEach(function(kpi, i) {
      var card = document.createElement('div');
      card.className = 'kpi-card' + (kpiOuvert === kpi.cle ? ' active' : '');
      card.innerHTML =
        '<div class="kpi-value">' + esc(valeurs[i]) + '</div>' +
        '<div class="kpi-label">' + esc(kpi.label) + '</div>';

      if (kpi.cle) {
        card.title = 'Voir le détail';
        card.addEventListener('click', function() { toggleKpiDetail(kpi.cle); });
      } else {
        card.style.cursor = 'default';
      }

      container.appendChild(card);
    });
  }

  // ── Détail KPI (panneau réseau) ───────────────────────────

  function toggleKpiDetail(cle) {
    if (kpiOuvert === cle) {
      kpiOuvert = null;
      $('kpi-detail').innerHTML = '';
      renderKpiBar();
      $('kpi-bar').scrollIntoView({ behavior: 'smooth', block: 'start' });
      return;
    }
    kpiOuvert = cle;
    renderKpiBar();
    renderKpiDetail(cle);
  }

  function renderKpiDetail(cle) {
    var p = periodeActuelle;
    var kpi = KPIS.find(function(k) { return k.cle === cle; });
    if (!kpi || !donnees) return;

    var t = _totaux ? _totaux[p] : null;
    var totalVal = t ? t[cle] : 0;

    // Répartition par ligne, triée par valeur décroissante
    var parLigne = donnees.map(function(l) {
      var info = B.LIGNES[l.id];
      return {
        id: l.id,
        nom: info ? info.nom : l.id,
        lbl: info ? info.lbl : l.id,
        fond: info ? info.fond : '#999',
        texte: info ? info.texte : '#fff',
        valeur: l.cout[p][cle] || 0,
        euros: l.cout[p].euros || 0,
        minutes: l.cout[p].minutes || 0,
      };
    }).filter(function(l) { return l.valeur > 0; })
      .sort(function(a, b) { return b.valeur - a.valeur; });

    var maxVal = parLigne.length ? parLigne[0].valeur : 1;

    var html = '<div class="detail-panel" style="margin-bottom:20px">';

    // Header
    html += '<div class="panel-header">' +
      '<span class="panel-title">' + esc(kpi.titre) + ' — ' + esc(PERIODES[p].label.toLowerCase()) + '</span>' +
      '<button class="panel-close" aria-label="Fermer" id="kpi-panel-close">&times;</button>' +
    '</div>';

    // Chiffre total
    html += '<div style="text-align:center;margin-bottom:18px">' +
      '<div style="font-size:clamp(28px,5vw,42px);font-weight:900;color:var(--ink);font-variant-numeric:tabular-nums">' + fmtNombre(totalVal) + '</div>' +
      '<div style="font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:4px">' + esc(kpi.label) + ' sur ' + (parLigne.length) + ' ligne' + (parLigne.length > 1 ? 's' : '') + '</div>' +
    '</div>';

    // Barres par ligne
    html += '<div style="margin-bottom:16px">';
    parLigne.forEach(function(l) {
      var w = maxVal > 0 ? (l.valeur / maxVal * 100) : 0;
      var detail = cle === 'minutes'
        ? formatDuree(l.valeur, true) + ' · ' + fmtEurosCompact(l.euros)
        : fmtNombre(l.valeur) + ' ' + kpi.label + ' · ' + fmtEurosCompact(l.euros) + ' · ' + formatDuree(l.minutes, true);
      html += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">' +
        '<span class="ligne-badge" style="background:' + l.fond + ';color:' + l.texte + ';font-size:12px;padding:3px 8px;min-width:48px;text-align:center">' + esc(l.lbl) + '</span>' +
        '<div style="flex:1;height:8px;background:var(--bg2);border-radius:4px;overflow:hidden">' +
          '<div style="height:100%;width:' + w.toFixed(1) + '%;background:' + l.fond + ';border-radius:4px"></div>' +
        '</div>' +
        '<span style="font-size:13px;font-weight:700;min-width:50px;text-align:right;white-space:nowrap">' + fmtNombre(l.valeur) + '</span>' +
      '</div>' +
      '<div style="font-size:11px;color:var(--muted);margin:-2px 0 8px 58px">' + esc(detail) + '</div>';
    });
    if (!parLigne.length) {
      html += '<p style="font-size:14px;color:var(--muted);text-align:center">Aucune donnée sur cette période.</p>';
    }
    html += '</div>';

    // Pour les retards : répartition par tranche de durée
    if (cle === 'nb_rt_delays') {
      html += renderTranchesRetard();
    }

    // Pour les perturbations : causes agrégées du réseau
    if (cle === 'nb_disruptions') {
      html += renderCausesReseau();
    }

    html += '</div>';

    $('kpi-detail').innerHTML = html;

    document.getElementById('kpi-panel-close').addEventListener('click', function() {
      toggleKpiDetail(cle);
    });

    $('kpi-detail').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function renderTranchesRetard() {
    var tranches = (_tranchesRetard && _tranchesRetard[periodeActuelle]) || [];
    if (!tranches.length) return '';

    var maxN = Math.max.apply(null, tranches.map(function(t) { return t.n; }));
    var total = tranches.reduce(function(s, t) { return s + t.n; }, 0);

    var html = '<div style="margin-top:8px"><div class="eyebrow" style="margin-bottom:10px">Répartition par durée de retard</div>';
    tranches.forEach(function(t) {
      var w = maxN > 0 ? (t.n / maxN * 100) : 0;
      html += '<div class="cause-row">' +
        '<span class="cause-label">' + esc(t.tranche) + '</span>' +
        '<div class="cause-bar-wrap"><div class="cause-bar" style="width:' + w.toFixed(1) + '%;background:var(--rouge)"></div></div>' +
        '<span class="cause-pct">' + t.pct + NBSP + '%</span></div>';
    });
    html += '</div>';
    return html;
  }

  function renderCausesReseau() {
    if (!donnees) return '';
    var toutes = {};
    var total = 0;
    donnees.forEach(function(l) {
      var causesObj = l.causes || {};
      var causes = causesObj[periodeActuelle] || [];
      causes.forEach(function(c) {
        toutes[c.libelle] = (toutes[c.libelle] || 0) + c.n;
        total += c.n;
      });
    });
    if (!total) return '';

    var items = Object.keys(toutes).map(function(k) { return { libelle: k, n: toutes[k] }; })
      .sort(function(a, b) { return b.n - a.n; });
    var maxN = items[0].n;

    var html = '<div style="margin-top:8px"><div class="eyebrow" style="margin-bottom:10px">Causes — réseau entier</div>';
    items.forEach(function(c) {
      var pct = Math.round(c.n / total * 100);
      var w = maxN > 0 ? (c.n / maxN * 100) : 0;
      html += '<div class="cause-row">' +
        '<span class="cause-label">' + esc(c.libelle) + '</span>' +
        '<div class="cause-bar-wrap"><div class="cause-bar" style="width:' + w.toFixed(1) + '%;background:var(--brun)"></div></div>' +
        '<span class="cause-pct">' + pct + NBSP + '%</span></div>';
    });
    html += '</div>';
    return html;
  }

  // ── Classement ────────────────────────────────────────────

  function renderClassement(lignes) {
    var p = periodeActuelle;
    var sorted = lignes.slice().sort(function(a, b) {
      return (b.cout[p].euros || 0) - (a.cout[p].euros || 0);
    });

    var totalEur = _totaux ? _totaux[p].euros : 0;
    var container = $('classement-list');
    container.innerHTML = '';

    sorted.forEach(function(ligne, i) {
      var info = B.LIGNES[ligne.id];
      if (!info) return;
      var c = ligne.cout[p];
      var pct = totalEur > 0 ? (c.euros / totalEur * 100) : 0;

      var card = document.createElement('div');
      card.className = 'ligne-card';
      card.setAttribute('role', 'button');
      card.setAttribute('tabindex', '0');
      card.setAttribute('aria-expanded', ligne.id === ligneSelectionnee ? 'true' : 'false');
      card.setAttribute('aria-label', info.nom + ' — ' + fmtEurosCompact(c.euros));
      card.dataset.id = ligne.id;

      card.innerHTML =
        '<span class="ligne-rank">#' + (i + 1) + '</span>' +
        '<span class="ligne-badge" style="background:' + info.fond + ';color:' + info.texte + '">' + esc(info.lbl) + '</span>' +
        '<span class="ligne-counters">' +
          '<span>' + fmtNombre(c.nb_rt_delays) + ' ret.</span>' +
          '<span>' + fmtNombre(c.nb_cancelled) + ' sup.</span>' +
          '<span>' + fmtNombre(c.nb_disruptions) + ' pert.</span>' +
        '</span>' +
        '<div class="ligne-bar-wrap"><div class="ligne-bar" style="width:' + pct.toFixed(1) + '%;background:' + info.fond + '"></div></div>' +
        '<span class="ligne-cost">' + esc(fmtEurosCompact(c.euros)) + '</span>' +
        '<span class="ligne-chevron">&#x203A;</span>';

      card.addEventListener('click', function() { selectLigne(ligne.id); });
      card.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectLigne(ligne.id); }
      });

      container.appendChild(card);
    });
  }

  // ── Sélection d'une ligne ─────────────────────────────────

  function selectLigne(id) {
    if (ligneSelectionnee === id) {
      ligneSelectionnee = null;
      $('detail-panel-container').innerHTML = '';
      document.querySelectorAll('.ligne-card').forEach(function(c) {
        c.setAttribute('aria-expanded', 'false');
      });
      $('kpi-bar').scrollIntoView({ behavior: 'smooth', block: 'start' });
      return;
    }
    ligneSelectionnee = id;

    document.querySelectorAll('.ligne-card').forEach(function(c) {
      c.setAttribute('aria-expanded', c.dataset.id === id ? 'true' : 'false');
    });

    var ligne = donnees.find(function(l) { return l.id === id; });
    if (!ligne) return;

    renderDetailPanel(ligne);
  }

  // ── Panneau détails ───────────────────────────────────────

  function renderDeltas(ligne) {
    var d = ligne.delta;
    if (!d) return '';
    var p = periodeActuelle;
    var dp = d[p];
    if (!dp) return '';

    var items = [
      { label: 'Coût', pct: dp.euros },
      { label: 'Retards', pct: dp.nb_rt_delays },
      { label: 'Supprimés', pct: dp.nb_cancelled },
      { label: 'Perturbations', pct: dp.nb_disruptions },
    ];

    var html = '<div class="panel-deltas">';
    items.forEach(function(item) {
      var fd = fmtDelta(item.pct);
      if (!fd) return;
      html += '<span class="delta-badge ' + fd.classe + '">' + esc(item.label) + ' ' + fd.texte + '</span>';
    });
    html += '</div>';
    return html;
  }

  function renderDetailPanel(ligne) {
    var info = B.LIGNES[ligne.id];
    if (!info) return;
    var p = periodeActuelle;

    var html = '<div class="detail-panel">';

    // Header
    html += '<div class="panel-header">' +
      '<span class="badge" style="background:' + info.fond + ';color:' + info.texte + '">' + esc(info.lbl) + '</span>' +
      '<span class="panel-title">' + esc(info.nom) + ' — ' + esc(fmtEurosCompact(ligne.cout[p].euros)) + '</span>' +
      '<button class="panel-close" aria-label="Fermer" id="panel-close">&times;</button>' +
    '</div>';

    // Deltas vs période précédente
    html += renderDeltas(ligne);

    // Compteurs détaillés (visibles en mobile car masqués sur les cartes)
    var c = ligne.cout[p];
    html += '<div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px;font-size:14px;color:var(--muted)">' +
      '<span>' + fmtNombre(c.nb_rt_delays) + ' retards</span>' +
      '<span>' + fmtNombre(c.nb_cancelled) + ' supprimés</span>' +
      '<span>' + fmtNombre(c.nb_disruptions) + ' perturbations</span>' +
      '<span>' + formatDuree(c.minutes, true) + '</span>' +
    '</div>';

    // Pire / Meilleur mois
    if (ligne.pire_mois || ligne.meilleur_mois) {
      html += '<div class="month-tiles">';
      if (ligne.pire_mois) {
        html += '<div class="month-tile worst">' +
          '<div class="mt-label">Pire mois</div>' +
          '<div class="mt-month">' + esc(MOIS[ligne.pire_mois.mois - 1]) + '</div>' +
          '<div class="mt-cost">' + esc(fmtEuros(ligne.pire_mois.cout_eur)) + ' · ' + esc(formatDuree(ligne.pire_mois.minutes, true)) + '</div>' +
        '</div>';
      }
      if (ligne.meilleur_mois) {
        html += '<div class="month-tile best">' +
          '<div class="mt-label">Meilleur mois</div>' +
          '<div class="mt-month">' + esc(MOIS[ligne.meilleur_mois.mois - 1]) + '</div>' +
          '<div class="mt-cost">' + esc(fmtEuros(ligne.meilleur_mois.cout_eur)) + ' · ' + esc(formatDuree(ligne.meilleur_mois.minutes, true)) + '</div>' +
        '</div>';
      }
      html += '</div>';
    }

    // Calendrier heatmap
    html += renderHeatmap(ligne);

    // Causes
    html += renderCauses(ligne);

    // Directions
    html += renderDirections(ligne);

    html += '</div>';

    $('detail-panel-container').innerHTML = html;

    document.getElementById('panel-close').addEventListener('click', function() {
      selectLigne(ligne.id);
    });

    $('detail-panel-container').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  // ── Heatmap calendrier ────────────────────────────────────

  function renderHeatmap(ligne) {
    var gravite = ligne.gravite_quotidienne || [];
    var parDate = {};
    gravite.forEach(function(g) { parDate[g.date] = g; });

    var aujourdhui = new Date();
    var annee = aujourdhui.getFullYear();

    var html = '<div class="heatmap-section">' +
      '<div class="eyebrow">Gravité quotidienne · ' + annee + '</div>' +
      '<div class="heatmap-wrap"><div class="heatmap">';

    for (var m = 0; m < 12; m++) {
      html += '<div class="hm-month">' + MOIS_COURT[m] + '</div>';
      var nbJours = new Date(annee, m + 1, 0).getDate();
      for (var j = 1; j <= 31; j++) {
        if (j > nbJours) { html += '<div class="hm-cell hm-null"></div>'; continue; }
        var dateStr = annee + '-' + String(m + 1).padStart(2, '0') + '-' + String(j).padStart(2, '0');
        var dateObj = new Date(annee, m, j);
        var g = parDate[dateStr];
        if (!g || g.niveau === null || dateObj > aujourdhui) {
          html += '<div class="hm-cell hm-empty" title="' + esc(dateStr) + '"></div>';
        } else {
          var niv = Math.min(4, Math.max(0, g.niveau));
          var title = dateStr + ' — ' + fmtEuros(g.cout_eur) + ' (niveau ' + niv + ')';
          html += '<div class="hm-cell hm-' + niv + '" title="' + esc(title) + '"></div>';
        }
      }
    }

    html += '</div></div>';
    html += '<div class="heatmap-hint">← glisser pour voir tout le calendrier →</div>';
    html += '</div>';
    return html;
  }

  // ── Causes ────────────────────────────────────────────────

  function renderCauses(ligne) {
    var causesObj = ligne.causes || {};
    var causes = causesObj[periodeActuelle] || [];
    if (!causes.length) return '';
    var maxPct = Math.max.apply(null, causes.map(function(c) { return c.pourcentage; }));
    var html = '<div class="causes-section"><div class="eyebrow">Causes des perturbations</div>';
    causes.forEach(function(c) {
      var w = maxPct > 0 ? (c.pourcentage / maxPct * 100) : 0;
      html += '<div class="cause-row">' +
        '<span class="cause-label">' + esc(c.libelle) + '</span>' +
        '<div class="cause-bar-wrap"><div class="cause-bar" style="width:' + w.toFixed(1) + '%;background:var(--brun)"></div></div>' +
        '<span class="cause-pct">' + c.pourcentage + NBSP + '%</span></div>';
    });
    html += '</div>';
    return html;
  }

  // ── Directions ────────────────────────────────────────────

  function renderDirections(ligne) {
    var dirs = ligne.directions || [];
    if (!dirs.length) return '';
    var html = '<div class="directions-section"><div class="eyebrow">Directions les plus touchées</div>';
    dirs.forEach(function(d) {
      var niv = Math.min(4, Math.max(0, d.niveau || 0));
      var couleur = GRAVITE_COULEURS[niv];
      html += '<div class="dir-row">' +
        '<span class="dir-dot" style="background:' + couleur + '" title="Niveau ' + niv + '"></span>' +
        '<span class="dir-label">' + esc(d.libelle) + '</span>' +
        '<span class="dir-count">' + d.incidents + ' incident' + (d.incidents > 1 ? 's' : '') + '</span></div>';
    });
    html += '</div>';
    return html;
  }

  // ── Chargement des données ────────────────────────────────

  function afficherMessage(texte) {
    $('contenu').hidden = true;
    $('contenu').removeAttribute('aria-busy');
    $('message').textContent = texte;
    $('message').hidden = false;
  }

  function render() {
    if (!donnees || !donnees.length) {
      afficherMessage('Aucune donnée disponible.');
      return;
    }
    $('message').hidden = true;
    $('contenu').hidden = false;
    $('contenu').removeAttribute('aria-busy');

    renderHero(donnees);
    renderKpiBar();
    renderClassement(donnees);

    if (ligneSelectionnee) {
      var ligne = donnees.find(function(l) { return l.id === ligneSelectionnee; });
      if (ligne) renderDetailPanel(ligne);
      else $('detail-panel-container').innerHTML = '';
    }
  }

  async function chargerDonnees() {
    $('contenu').setAttribute('aria-busy', 'true');
    try {
      var resp = await fetch('/data/hall-of-shame.json');
      if (resp.status === 404) {
        donnees = null;
      } else if (!resp.ok) {
        throw new Error('HTTP ' + resp.status);
      } else {
        var json = await resp.json();
        donnees = json.lignes || [];
        _totaux = json.totaux || null;
        _tranchesRetard = json.tranches_retard || {};
        if (json.meta) {
          majHeure = new Date(json.meta.genere_a).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Paris' }).replace(':', 'H');
          smicHoraire = json.meta.smic_horaire || 0;
          meta = json.meta;
          $('pied').textContent = 'Données API PRIM · IDF Mobilités';
        }
      }
    } catch (e) {
      donnees = null;
    }

    if (!donnees) {
      afficherMessage('Bilan en cours de calcul, réessayer dans quelques minutes.');
      return;
    }

    render();
  }

  // ── Sélecteur de période ──────────────────────────────────

  function setPeriode(p) {
    periodeActuelle = p;
    document.querySelectorAll('.toggle button').forEach(function(b) {
      b.setAttribute('aria-pressed', b.dataset.p === p ? 'true' : 'false');
    });
    ligneSelectionnee = null;
    kpiOuvert = null;
    $('detail-panel-container').innerHTML = '';
    $('kpi-detail').innerHTML = '';
    render();
  }

  document.querySelectorAll('.toggle button').forEach(function(b) {
    b.addEventListener('click', function() { setPeriode(b.dataset.p); });
  });

  // ── Init ──────────────────────────────────────────────────

  chargerDonnees();

})();
</script>
<script>
(function() {
  var btn = document.getElementById('nav-burger');
  var menu = document.getElementById('nav-menu');
  btn.addEventListener('click', function(e) {
    e.stopPropagation();
    menu.classList.toggle('open');
  });
  document.addEventListener('click', function(e) {
    if (!menu.contains(e.target)) menu.classList.remove('open');
  });
})();
</script>
</body>
</html>
