<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Retards IDF — Statistiques</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3248;
      --text: #e8eaf6;
      --muted: #7c8099;
      --accent: #4f8ef7;
      --red: #e53935;
      --yellow: #ffd740;
      --green: #43a047;
    }

    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    }
    .logo { display: flex; align-items: center; gap: 0.75rem; }
    .logo-icon { width: 40px; height: 40px; background: var(--red); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; }
    h1 { font-size: 1.2rem; font-weight: 700; }
    h1 span { color: var(--muted); font-weight: 400; }

    nav { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 2rem; display: flex; }
    nav a { color: var(--muted); text-decoration: none; font-size: 0.85rem; padding: 0.75rem 1rem; border-bottom: 2px solid transparent; transition: color 0.15s, border-color 0.15s; }
    nav a.active, nav a:hover { color: var(--text); border-color: var(--accent); }

    main { max-width: 1200px; margin: 0 auto; padding: 2rem; }

    .section-title { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 1rem; }

    /* ── Period selector ── */
    .period-bar {
      display: flex; align-items: center; gap: 0.5rem;
      margin-bottom: 2rem;
    }
    .period-label { font-size: 0.8rem; color: var(--muted); margin-right: 0.5rem; }
    .period-btn {
      background: var(--surface); border: 1px solid var(--border);
      color: var(--muted); font-size: 0.8rem; padding: 0.4rem 0.9rem;
      border-radius: 20px; cursor: pointer; transition: all 0.15s;
    }
    .period-btn:hover { border-color: var(--accent); color: var(--text); }
    .period-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

    /* ── Two columns ── */
    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 2rem; }
    @media (max-width: 768px) { .cols { grid-template-columns: 1fr; } }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem 1.5rem; }
    .card h3 { font-size: 0.85rem; font-weight: 600; margin-bottom: 1rem; }

    /* ── Ranking list ── */
    .rank-list { display: flex; flex-direction: column; gap: 0.5rem; }
    .rank-item {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      background: var(--surface2);
      cursor: pointer;
      transition: background 0.15s;
    }
    .rank-item:hover { background: var(--border); }
    .rank-item.selected { background: rgba(79,142,247,0.15); border: 1px solid rgba(79,142,247,0.3); }
    .rank-num { font-size: 0.7rem; color: var(--muted); width: 18px; text-align: right; flex-shrink: 0; }
    .line-badge { flex-shrink: 0; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.62rem; font-weight: 800; }
    .rank-info { flex: 1; min-width: 0; }
    .rank-name { font-size: 0.82rem; font-weight: 600; }
    .rank-val { font-size: 0.72rem; color: var(--muted); }
    .rank-bar-wrap { width: 80px; flex-shrink: 0; }
    .rank-bar-bg { background: var(--border); border-radius: 3px; height: 6px; }
    .rank-bar-fill { background: var(--accent); border-radius: 3px; height: 6px; transition: width 0.4s; }

    /* ── Detail chart ── */
    .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; margin-bottom: 2rem; }
    .chart-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; flex-wrap: wrap; gap: 0.5rem; }
    .chart-header h3 { font-size: 0.9rem; font-weight: 600; }
    .chart-wrap { position: relative; height: 240px; }
    .chart-line-badge { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.58rem; font-weight: 800; }

    /* ── Summary table ── */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    thead th { text-align: left; padding: 0.5rem 0.75rem; color: var(--muted); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid var(--border); white-space: nowrap; }
    thead th.num { text-align: right; }
    tbody tr { border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.1s; }
    tbody tr:hover { background: var(--surface2); }
    tbody tr.selected { background: rgba(79,142,247,0.1); }
    tbody td { padding: 0.6rem 0.75rem; }
    tbody td.num { text-align: right; color: var(--text); }
    tbody td.muted { color: var(--muted); }
    .tbl-badge { width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 0.6rem; font-weight: 800; }

    /* Skeleton */
    .skeleton { background: linear-gradient(90deg, var(--surface2) 25%, var(--border) 50%, var(--surface2) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 6px; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    .empty { text-align: center; padding: 2rem; color: var(--muted); font-size: 0.85rem; }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">🚆</div>
    <div><h1>Retards IDF <span>/ Statistiques</span></h1></div>
  </div>
</header>

<nav>
  <a href="index.html">Tableau de bord</a>
  <a href="stats.html" class="active">Statistiques</a>
  <a href="methode.html">Méthode</a>
</nav>

<main>

  <div class="period-bar">
    <span class="period-label">Période :</span>
    <button class="period-btn" data-days="7">7 jours</button>
    <button class="period-btn active" data-days="30">30 jours</button>
    <button class="period-btn" data-days="90">90 jours</button>
  </div>

  <!-- Rankings -->
  <div class="cols">
    <div class="card">
      <h3>Classement — Incidents</h3>
      <div class="rank-list" id="rank-incidents">
        <div class="skeleton" style="height:44px"></div>
        <div class="skeleton" style="height:44px"></div>
        <div class="skeleton" style="height:44px"></div>
      </div>
    </div>
    <div class="card">
      <h3>Classement — Minutes-voyageurs perdues</h3>
      <div class="rank-list" id="rank-mv">
        <div class="skeleton" style="height:44px"></div>
        <div class="skeleton" style="height:44px"></div>
        <div class="skeleton" style="height:44px"></div>
      </div>
    </div>
  </div>

  <!-- Detail chart for selected line -->
  <div class="chart-card" id="detail-card">
    <div class="chart-header">
      <div style="display:flex;align-items:center;gap:0.75rem">
        <div class="chart-line-badge" id="detail-badge"></div>
        <h3 id="detail-title">Sélectionne une ligne pour voir le détail</h3>
      </div>
      <div id="detail-kpis" style="display:flex;gap:1.5rem;font-size:0.78rem;color:var(--muted)"></div>
    </div>
    <div class="chart-wrap">
      <canvas id="chart-detail"></canvas>
    </div>
  </div>

  <!-- Full table -->
  <p class="section-title">Toutes les lignes</p>
  <div class="card">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Ligne</th>
            <th class="num">Incidents</th>
            <th class="num">Jours perturbés</th>
            <th class="num">Durée totale</th>
            <th class="num">Min.-voyageurs</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <tr><td colspan="5" class="empty">Chargement…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</main>

<script>
const LINE_COLORS = {
  'RER_A':       { bg: '#E3051B', fg: '#fff' },
  'RER_B':       { bg: '#4DA4DC', fg: '#fff' },
  'RER_C':       { bg: '#F3D929', fg: '#000' },
  'RER_D':       { bg: '#5FAA00', fg: '#fff' },
  'RER_E':       { bg: '#6E1E78', fg: '#fff' },
  'TRANSILIEN_H':{ bg: '#7B7B7B', fg: '#fff' },
  'TRANSILIEN_J':{ bg: '#D2B464', fg: '#000' },
  'TRANSILIEN_K':{ bg: '#8C4B31', fg: '#fff' },
  'TRANSILIEN_L':{ bg: '#9F3E96', fg: '#fff' },
  'TRANSILIEN_N':{ bg: '#1F1F1F', fg: '#fff' },
  'TRANSILIEN_P':{ bg: '#E87722', fg: '#fff' },
  'TRANSILIEN_R':{ bg: '#228B22', fg: '#fff' },
  'TRANSILIEN_U':{ bg: '#7B0F1F', fg: '#fff' },
};

const ALL_LINES = Object.keys(LINE_COLORS);

function lineShort(id) {
  return id.replace('TRANSILIEN_', '').replace('RER_', 'RER ');
}

function fmt(n) {
  if (n >= 1_000_000) return (n / 1_000_000).toFixed(1).replace('.', ',') + ' M';
  if (n >= 1_000) return Math.round(n / 1_000) + ' k';
  return n.toString();
}

function fmtDur(min) {
  if (!min) return '0 min';
  const h = Math.floor(min / 60), m = min % 60;
  return h > 0 ? `${h}h${m > 0 ? m + 'm' : ''}` : `${m} min`;
}

let currentPeriod = 30;
let allData = {};
let selectedLine = null;
let detailChart = null;

/* ── Fetch all lines ── */
async function fetchAll(days) {
  const results = await Promise.all(
    ALL_LINES.map(l =>
      fetch(`/api/stats/line/${l}?period=${days}`)
        .then(r => r.ok ? r.json() : null)
        .catch(() => null)
    )
  );
  const map = {};
  ALL_LINES.forEach((l, i) => { if (results[i]) map[l] = results[i]; });
  return map;
}

/* ── Render rankings ── */
function renderRankings(data) {
  const sorted_inc = Object.entries(data)
    .map(([id, d]) => ({ id, val: d.total_incidents }))
    .sort((a, b) => b.val - a.val);

  const sorted_mv = Object.entries(data)
    .map(([id, d]) => ({ id, val: d.total_minutes_voyageurs }))
    .sort((a, b) => b.val - a.val);

  const maxInc = sorted_inc[0]?.val || 1;
  const maxMv = sorted_mv[0]?.val || 1;

  function renderList(containerId, items, maxVal, fmtFn) {
    const el = document.getElementById(containerId);
    if (items.every(i => i.val === 0)) {
      el.innerHTML = '<div class="empty">Aucune donnée sur cette période</div>';
      return;
    }
    el.innerHTML = items.map((item, idx) => {
      const c = LINE_COLORS[item.id];
      const pct = Math.round((item.val / maxVal) * 100);
      const sel = item.id === selectedLine ? 'selected' : '';
      return `
        <div class="rank-item ${sel}" onclick="selectLine('${item.id}')">
          <span class="rank-num">${idx + 1}</span>
          <div class="line-badge" style="background:${c.bg};color:${c.fg}">${lineShort(item.id)}</div>
          <div class="rank-info">
            <div class="rank-name">${lineShort(item.id)}</div>
            <div class="rank-val">${fmtFn(item.val)}</div>
          </div>
          <div class="rank-bar-wrap">
            <div class="rank-bar-bg">
              <div class="rank-bar-fill" style="width:${pct}%"></div>
            </div>
          </div>
        </div>`;
    }).join('');
  }

  renderList('rank-incidents', sorted_inc, maxInc, v => `${v} incident${v > 1 ? 's' : ''}`);
  renderList('rank-mv', sorted_mv, maxMv, v => `${fmt(v)} min-voy.`);
}

/* ── Render table ── */
function renderTable(data) {
  const rows = Object.entries(data)
    .map(([id, d]) => ({ id, ...d }))
    .sort((a, b) => b.total_incidents - a.total_incidents);

  const tbody = document.getElementById('table-body');
  if (rows.length === 0 || rows.every(r => r.total_incidents === 0)) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty">Aucune donnée sur cette période</td></tr>';
    return;
  }

  tbody.innerHTML = rows.map(r => {
    const c = LINE_COLORS[r.id];
    const sel = r.id === selectedLine ? 'selected' : '';
    return `
      <tr class="${sel}" onclick="selectLine('${r.id}')">
        <td>
          <div style="display:flex;align-items:center;gap:0.6rem">
            <div class="tbl-badge" style="background:${c.bg};color:${c.fg}">${lineShort(r.id)}</div>
            <span>${lineShort(r.id)}</span>
          </div>
        </td>
        <td class="num">${r.total_incidents}</td>
        <td class="num">${r.jours_perturbes} j</td>
        <td class="num muted">${fmtDur(r.total_duree_min)}</td>
        <td class="num">${fmt(r.total_minutes_voyageurs)}</td>
      </tr>`;
  }).join('');
}

/* ── Detail chart ── */
function selectLine(lineId) {
  selectedLine = lineId;
  renderRankings(allData);
  renderTable(allData);

  const data = allData[lineId];
  if (!data) return;

  const c = LINE_COLORS[lineId];
  document.getElementById('detail-badge').style.background = c.bg;
  document.getElementById('detail-badge').style.color = c.fg;
  document.getElementById('detail-badge').textContent = lineShort(lineId);
  document.getElementById('detail-title').textContent = `${lineShort(lineId)} — ${currentPeriod} derniers jours`;
  document.getElementById('detail-kpis').innerHTML = `
    <span><strong style="color:var(--text)">${data.total_incidents}</strong> incidents</span>
    <span><strong style="color:var(--text)">${data.jours_perturbes}</strong> jours perturbés</span>
    <span><strong style="color:var(--text)">${fmt(data.total_minutes_voyageurs)}</strong> min-voy.</span>
  `;

  const labels = data.daily.map(d => {
    const dt = new Date(d.date + 'T12:00:00');
    return dt.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' });
  });
  const values = data.daily.map(d => d.nb_incidents);

  const ctx = document.getElementById('chart-detail').getContext('2d');
  if (detailChart) detailChart.destroy();
  detailChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        label: 'Incidents',
        data: values,
        backgroundColor: c.bg + 'cc',
        borderColor: c.bg,
        borderWidth: 1,
        borderRadius: 3,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: (item) => ` ${item.raw} incident${item.raw > 1 ? 's' : ''}`,
          }
        }
      },
      scales: {
        x: { ticks: { color: '#7c8099', font: { size: 10 }, maxRotation: 45 }, grid: { color: '#2e3248' } },
        y: { ticks: { color: '#7c8099', font: { size: 10 }, stepSize: 1 }, grid: { color: '#2e3248' }, beginAtZero: true },
      }
    }
  });
}

/* ── Load ── */
async function load(days) {
  document.getElementById('rank-incidents').innerHTML = '<div class="skeleton" style="height:44px"></div><div class="skeleton" style="height:44px"></div><div class="skeleton" style="height:44px"></div>';
  document.getElementById('rank-mv').innerHTML = '<div class="skeleton" style="height:44px"></div><div class="skeleton" style="height:44px"></div><div class="skeleton" style="height:44px"></div>';
  document.getElementById('table-body').innerHTML = '<tr><td colspan="5" class="empty">Chargement…</td></tr>';

  try {
    allData = await fetchAll(days);
    renderRankings(allData);
    renderTable(allData);
    if (selectedLine) selectLine(selectedLine);
    else {
      // Auto-select the most impacted line
      const top = Object.entries(allData).sort((a, b) => b[1].total_incidents - a[1].total_incidents)[0];
      if (top && top[1].total_incidents > 0) selectLine(top[0]);
    }
  } catch (err) {
    console.error(err);
    document.getElementById('table-body').innerHTML = '<tr><td colspan="5" class="empty" style="color:var(--red)">Erreur de connexion à l\'API</td></tr>';
  }
}

/* ── Period buttons ── */
document.querySelectorAll('.period-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentPeriod = parseInt(btn.dataset.days);
    selectedLine = null;
    load(currentPeriod);
  });
});

load(currentPeriod);
</script>
</body>
</html>
