<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RETARDS IDF — Compteur en temps réel</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="nav.css">
  <link rel="stylesheet" href="pick.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #F7F4EF;
      --bg2:    #EDEAE4;
      --bg3:    #E2DED7;
      --border: #D4CFC7;
      --ink:    #000000;
      --text:   #000000;
      --muted:  #555555;
      --sub:    #333333;
      --red:    #C0392B;
      --ok:     #2ECC71;
    }

    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Roboto', sans-serif;
      font-size: 16px;
      overflow-x: hidden;
    }

    /* ── Hero ── */
    .hero {
      padding: 40px 32px 24px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }
    .hero-date {
      font-weight: 400;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--sub);
      margin-bottom: 16px;
    }
    .hero-subtitle {
      font-weight: 500;
      font-size: clamp(16px, 2.4vw, 22px);
      line-height: 1.3;
      color: var(--ink);
      margin-bottom: 14px;
    }
    .hero-counter {
      font-weight: 900;
      font-size: clamp(52px, 10.4vw, 112px);
      letter-spacing: -3px;
      line-height: .88;
      color: var(--ink);
    }
    .hero-equiv {
      font-weight: 500;
      font-size: clamp(14px, 2vw, 18px);
      color: var(--ink);
      margin-top: 18px;
      line-height: 1.4;
    }
    .hero-base {
      font-weight: 400;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 8px;
    }

    /* ── Footer ── */
    footer {
      border-top: 2px solid var(--ink);
      padding: 18px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .footer-left, .footer-right {
      font-weight: 400;
      font-size: 12px;
      color: var(--sub);
    }
    .footer-right a {
      color: var(--sub);
      text-decoration: none;
      margin-left: 14px;
      transition: color 0.15s;
    }
    .footer-right a:hover { color: var(--ink); }

    @media (max-width: 768px) {
      .hero { padding: 32px 16px 20px; }
      footer { padding: 14px 16px; flex-direction: column; align-items: flex-start; }
      .footer-right a:first-child { margin-left: 0; }
    }
  </style>
</head>
<body>

<!-- Hamburger -->
<button class="nav-burger" id="nav-burger" aria-label="Menu">&#9776;</button>
<ul class="nav-menu" id="nav-menu">
  <li><a href="/" class="active" aria-current="page">Aujourd'hui</a></li>
  <li><a href="/temps-reel">Temps réel</a></li>
  <li><a href="/statistiques">Statistiques</a></li>
  <li><a href="/mon-trajet">Mon trajet</a></li>
  <li><a href="/methode.html">Méthode</a></li>
</ul>

<!-- Hero — coût du jour -->
<section class="hero">
  <div class="hero-date" id="hero-date">&nbsp;</div>
  <div class="hero-subtitle">Aujourd'hui, les retards des RER et Transiliens ont coûté</div>
  <div class="hero-counter" id="hero-eur">— €</div>
  <div class="hero-equiv" id="hero-equiv">&nbsp;</div>
  <div class="hero-base">base SMIC 12,31 €/h</div>
</section>

<!-- Et toi, ta ligne ? -->
<div class="pick-section" id="pick-container"></div>

<!-- Footer -->
<footer>
  <div class="footer-left">Données : API PRIM · IDF Mobilités · Licence Open Data Etalab</div>
  <div class="footer-right">
    <a href="/methode.html">Méthodologie</a>
    <a href="https://github.com/" target="_blank" rel="noopener">GitHub</a>
    <a href="mailto:contact@retardsidf.fr">Contact</a>
  </div>
</footer>

<!-- JavaScript -->
<script src="duree.js"></script>
<script>
  const LINE_META = {
    'RER_A':        { short: 'A', name: 'RER A',        color: '#E2231A' },
    'RER_B':        { short: 'B', name: 'RER B',        color: '#5191CF' },
    'RER_C':        { short: 'C', name: 'RER C',        color: '#C8A800', textColor: '#1A1916' },
    'RER_D':        { short: 'D', name: 'RER D',        color: '#00814F' },
    'RER_E':        { short: 'E', name: 'RER E',        color: '#B04191' },
    'TRANSILIEN_H': { short: 'H', name: 'Transilien H', color: '#7B7B7B' },
    'TRANSILIEN_J': { short: 'J', name: 'Transilien J', color: '#D2B464', textColor: '#1A1916' },
    'TRANSILIEN_K': { short: 'K', name: 'Transilien K', color: '#8C4B31', textColor: '#1A1916' },
    'TRANSILIEN_L': { short: 'L', name: 'Transilien L', color: '#9F3E96' },
    'TRANSILIEN_N': { short: 'N', name: 'Transilien N', color: '#333333' },
    'TRANSILIEN_P': { short: 'P', name: 'Transilien P', color: '#E87722', textColor: '#1A1916' },
    'TRANSILIEN_R': { short: 'R', name: 'Transilien R', color: '#228B22', textColor: '#1A1916' },
    'TRANSILIEN_U': { short: 'U', name: 'Transilien U', color: '#7B0F1F' },
  };

  function fmt(n) {
    return n.toLocaleString('fr-FR');
  }
</script>
<script src="pick.js"></script>
<script>
  async function fetchToday() {
    try {
      const res = await fetch('/api/stats/today');
      if (!res.ok) return;
      const stats = await res.json();
      const cout = stats.cout_eur || 0;
      const mv = stats.total_minutes_voyageurs || 0;
      document.getElementById('hero-eur').textContent = fmt(cout) + ' €';
      document.getElementById('hero-equiv').textContent =
        'soit ' + formatDuree(mv) + ' de vie ' + accordPerdu(mv) + ' collectivement';
    } catch (_) {}
  }
  fetchToday();
  setInterval(fetchToday, 300000);

  /* ── Date/heure ── */
  function updateDate() {
    const now = new Date();
    const jours = ['DIMANCHE','LUNDI','MARDI','MERCREDI','JEUDI','VENDREDI','SAMEDI'];
    const mois  = ['JANVIER','FÉVRIER','MARS','AVRIL','MAI','JUIN',
                   'JUILLET','AOÛT','SEPTEMBRE','OCTOBRE','NOVEMBRE','DÉCEMBRE'];
    document.getElementById('hero-date').textContent =
      jours[now.getDay()] + ' ' + now.getDate() + ' ' + mois[now.getMonth()] + ' ' +
      now.getFullYear() + '  ·  MÀJ ' +
      String(now.getHours()).padStart(2, '0') + 'H' +
      String(now.getMinutes()).padStart(2, '0');
  }
  updateDate();
  setInterval(updateDate, 60000);

  /* ── Picker ── */
  Pick.init(document.getElementById('pick-container'), {
    showTitle: true,
    showPageLink: true,
    showRank: false,
    defaultPeriod: 'jour',
  });

  /* ── Hamburger ── */
  (function() {
    var btn = document.getElementById('nav-burger');
    var menu = document.getElementById('nav-menu');
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      menu.classList.toggle('open');
    });
    document.addEventListener('click', function(e) {
      if (!menu.contains(e.target)) menu.classList.remove('open');
    });
  })();
</script>
</body>
</html>
